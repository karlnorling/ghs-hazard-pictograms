nodeLinker: node-modules

# ---------------------------------------------------------------------------
# Supply-chain guards
# ---------------------------------------------------------------------------

# Refuse to resolve any npm version published less than a week ago. Compromised
# releases are almost always caught and unpublished within hours, so waiting out
# that window avoids the whole class of attack.
#
# This applies to every resolution — `yarn add`, `yarn up`, lockfile refreshes,
# local and CI alike — which makes it the backstop for Dependabot *security*
# updates, since those deliberately ignore dependabot.yml's `cooldown`.
#
# It does not fail an install. Yarn silently resolves to the newest version in
# range that is old enough, so a brand-new patch is skipped until it ages in.
# `yarn install --immutable` against a complete lockfile does no resolution, so
# CI is unaffected.
npmMinimalAgeGate: '7d'

# Publish @ghs-hazard-pictograms/* packages to the public npm registry.
npmScopes:
  ghs-hazard-pictograms:
    npmRegistryServer: 'https://registry.npmjs.org/'
    npmAuthToken: '${NPM_JS_AUTH:-}'
